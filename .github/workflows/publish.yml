name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish Version (leave empty to use version defined in build.gradle.kts)'
        required: false
        default: ''

jobs:
  publish:
    name: Build & Publish KMP to GitHub Packages
    runs-on: macos-15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          if [ -n "$VERSION" ]; then
            echo "Publishing version: $VERSION"
            ./gradlew :pagkit:publishAllPublicationsToGitHubPackagesRepository -Pversion="$VERSION"
          else
            ./gradlew :pagkit:publishAllPublicationsToGitHubPackagesRepository
          fi
